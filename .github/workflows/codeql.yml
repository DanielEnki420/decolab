# CodeQL: static analysis of the Python, JavaScript and the workflows
# themselves. A workflow file instead of GitHub's "default setup", so the
# configuration is in the repository (reviewed, pinned) and OpenSSF
# Scorecard can see it. On every push to main and weekly.
name: codeql

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions: read-all

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write # upload the findings to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
