# SSH hardening (HARDENING=yes), installed by "decolab-firewall apply" as
# /etc/ssh/sshd_config.d/01-decolab.conf; removed by decolab-firewall-boot off.
#
# 01-, not 99-: sshd keeps the FIRST value it reads, and the drop-ins are
# read in name order. A 50-cloud-init.conf would otherwise win.
#
# Not here, on purpose:
#   Port            changing it is how people lock themselves out
#   PasswordAuthentication / KbdInteractiveAuthentication
#                   apply adds both (no) with SSH_PASSWORDS=no; the login
#                   that confirms then proves a key works
#   AllowTcpForwarding no   it would break "ssh -L" to the web interfaces
#                   that listen on 127.0.0.1 only
MaxAuthTries 6
LoginGraceTime 30
ClientAliveInterval 120
ClientAliveCountMax 3
PermitRootLogin no
AllowTcpForwarding local
AllowAgentForwarding no
X11Forwarding no
