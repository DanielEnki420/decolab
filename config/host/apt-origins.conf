// Unattended upgrades, installed as /etc/apt/apt.conf.d/51-decolab-origins.
//
// Debian's default patches only Debian packages. The kernel (Raspberry Pi
// Foundation), Tailscale and CrowdSec come from their vendors' repositories
// and would otherwise stay unpatched.
Unattended-Upgrade::Origins-Pattern {
    "origin=Raspberry Pi Foundation";
    "origin=Docker";
    "origin=Tailscale";
    "origin=packagecloud.io/crowdsec/crowdsec";
};

// Except the Docker engine. Updating docker-ce or containerd.io restarts
// dockerd and with it every container, at a random time in the morning
// (apt-daily-upgrade), without a maintenance flag, in the middle of other
// jobs. Docker is updated by update.sh instead; the morning report says when
// a Docker update is waiting.
// Entries are Python regular expressions (re.match), anchored, or "docker-ce"
// would also match docker-ce-cli. No backslashes (apt.conf quoting): the dot
// in containerd.io matches any character and still only matches that package.
Unattended-Upgrade::Package-Blacklist {
    "^docker-ce$";
    "^docker-ce-cli$";
    "^docker-ce-rootless-extras$";
    "^docker-buildx-plugin$";
    "^docker-compose-plugin$";
    "^containerd.io$";
};
