// Automatic reboot after updates that need one (kernel), installed as
// /etc/apt/apt.conf.d/52-decolab-reboot.
//
// 05:17 lies
//   * AFTER the night's backups: 03:00 backup, 03:15 Immich, 03:30 verify,
//     03:50 USB copy, 04:10 off-site
//   * BEFORE the restore probes from 05:50: they run on the freshly started
//     system and fail if something does not come back up after the reboot
//   * on an odd minute: the */5 and */15 checks of 05:15 are done, so the
//     reboot interrupts no running check
//
// unattended-upgrades itself runs between 06:00 and 07:00 (apt-daily-upgrade,
// RandomizedDelaySec=60m). A kernel installed there becomes active the NEXT
// day at 05:17, never during the day.
//
// Whoever changes the night schedule (config/cron) must check this time too.
// WithUsers=true: a forgotten SSH session must not block the reboot.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "05:17";
