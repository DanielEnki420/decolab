# Kernel hardening (HARDENING=yes), installed as /etc/modprobe.d/90-decolab.conf.
# Rarely used network protocols with a history of kernel holes. Decolab
# publishes no SCTP ports. Some kernels ship only some of these as modules;
# the others are listed in case a future kernel brings them.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
