# needrestart, installed as /etc/needrestart/conf.d/90-decolab.conf BEFORE
# needrestart itself, so that its very first run restarts nothing.
#
# After updates only LIST services still running with old libraries, never
# restart them: restarting docker in the middle of an update would take every
# container down with it. A planned reboot (apt-reboot.conf) picks them up.
$nrconf{restart} = 'l';
$nrconf{kernelhints} = 0;
$nrconf{override_rc}{qr(^(docker|containerd|tailscaled|ssh|crowdsec|crowdsec-firewall-bouncer|nut-.*|decolab-.*)\.service)} = 0;
