# NUT (HW_UPS), installed as /etc/nut/nut.conf.
MODE=standalone

# No POWEROFF_WAIT. nutshutdown (/lib/systemd/system-shutdown) sleeps that
# long AFTER telling the UPS to cut power but BEFORE the kernel powers off.
# The UPS cut the power after offdelay in the middle of that sleep, and the
# SSD never got its shutdown signal: its "unsafe shutdowns" counter grew with
# every UPS shutdown. The sleep is meant for UPSes that do not switch off when
# mains power has already returned; if the Pi ever stays off after an outage,
# unplug its power supply briefly.
