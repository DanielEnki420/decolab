# NUT (HW_UPS), installed as /etc/nut/ups.conf. A USB UPS on the Pi.
#
# usbhid-ups with port = auto finds most USB HID UPSes by itself. If you have
# more than one, or nut-scanner -U recommends another driver, adjust it here.
maxretry = 3
# The USB device sometimes appears late at boot; the driver retries.
retrydelay = 5

[ups]
  driver = usbhid-ups
  port = auto
  desc = "UPS for the Decolab host"
  # After shutting down: outlets off after 30 s, back on 60 s after mains
  # power returns (shutdown.return), so the Pi 5 starts by itself. Some
  # models (Eaton/MGE) require ondelay > offdelay.
  offdelay = 30
  ondelay = 60
  # Decide "battery low" by charge only, NOT by the estimated runtime: many
  # small UPSes report load 0 on mains and their runtime estimate jumps when
  # switching to battery, which must not shut the host down. 30 % leaves
  # enough for a clean shutdown of all containers. upssched.conf adds a hard
  # limit of 30 minutes on battery (deep discharge, wrong estimates, old
  # battery).
  ignorelb
  override.battery.charge.low = 30
