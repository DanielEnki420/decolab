# NUT (HW_UPS), installed as /etc/nut/upssched.conf. Timers for UPS events.
# Runs as user nut; /usr/local/sbin/decolab-ups-event hands each event to
# ups-event.sh as the Decolab user (sudoers: /etc/sudoers.d/decolab-nut).
CMDSCRIPT /usr/local/sbin/decolab-ups-event
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Report a power outage only once it has lasted 10 s: short flicker stays
# quiet.
AT ONBATT * START-TIMER power-lost 10
# Back on mains: if the timer is still running it was only flicker (cancel
# quietly); if it already fired, "power lost" was reported -> "power back".
AT ONLINE * CANCEL-TIMER power-lost power-back

# Hard limit: after 30 minutes on battery shut down cleanly in any case. It
# protects a lead battery from deep discharge and works even when the charge
# reading is wrong. Check this value after your first real test.
AT ONBATT * START-TIMER battery-limit 1800
AT ONLINE * CANCEL-TIMER battery-limit

# Battery low / shutting down: at once (FSD and SHUTDOWN often both arrive,
# ups-event.sh reports only the first).
AT FSD * EXECUTE shutdown
AT SHUTDOWN * EXECUTE shutdown

# USB connection lost: report after 60 s; if it comes back sooner, stay quiet.
AT COMMBAD * START-TIMER usb-lost 60
AT COMMOK * CANCEL-TIMER usb-lost usb-back

AT REPLBATT * EXECUTE replace-battery
