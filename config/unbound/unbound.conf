# Unbound: recursive, DNSSEC-validating resolver behind Pi-hole.
#
# Only Pi-hole asks Unbound (over dns_net); Unbound publishes no port. It asks
# the root and authoritative name servers itself, so no DNS provider sees the
# household's queries.
#
# Every non-default value below has a reason. Where a value was found by
# measurement, the comment says what was measured, so that nobody "fixes" it
# back.

server:
    # --- Basics --------------------------------------------------------------

    interface: 0.0.0.0@5335
    directory: "/usr/local/unbound"
    do-daemonize: no

    # The container starts unbound directly as UNBOUND_UID. A second privilege
    # drop (username) or a chroot needs root and fails with "Operation not
    # permitted". The container is the isolation boundary.
    username: ""
    chroot: ""

    # dns_net has no IPv6, so Unbound cannot reach IPv6 name servers. With
    # do-ip6 yes it spends its retries on unreachable IPv6 addresses and then
    # gives up: measured with a cold cache, 20 domains x 6 rounds, about half
    # of all lookups ended in SERVFAIL. A warm cache hides this until the
    # cache is flushed.
    do-ip6: no

    # --- Cache ---------------------------------------------------------------

    # 0 = keep records exactly as long as their owner says. A higher minimum
    # holds on to outdated addresses of CDNs that rotate them every 20-60 s:
    # apps then hang and smart speakers lose their connection.
    cache-min-ttl: 0
    cache-max-ttl: 86400

    # Sized to fit the container's memory limit (compose: mem_limit 192m)
    # together with Unbound's own overhead. rrset about twice msg, as the
    # Unbound documentation recommends.
    msg-cache-size: 32m
    rrset-cache-size: 64m
    neg-cache-size: 4m

    # Answer from an expired record only in an emergency (the outside world is
    # unreachable): wait 1.8 s for a fresh answer first, and never serve data
    # that expired more than an hour ago.
    serve-expired: yes
    serve-expired-client-timeout: 1800
    serve-expired-ttl: 3600
    prefetch: yes
    prefetch-key: yes

    # --- Privacy -------------------------------------------------------------

    qname-minimisation: yes
    aggressive-nsec: yes
    hide-identity: yes
    hide-version: yes
    identity: "DNS"
    http-user-agent: "DNS"
    minimal-responses: yes

    # --- Security ------------------------------------------------------------

    # Only Pi-hole (dns_net) and the container itself. Nothing else can reach
    # this port anyway; the list makes it explicit.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.20.0.0/24 allow

    # The image writes this file at every start (unbound-anchor), so a fresh
    # install needs nothing in var/ before the first start.
    auto-trust-anchor-file: "iana.d/root.key"
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
    harden-dnssec-stripped: yes
    harden-algo-downgrade: yes
    harden-below-nxdomain: yes
    harden-glue: yes
    harden-large-queries: yes
    harden-short-bufsize: yes
    harden-referral-path: no
    val-clean-additional: yes
    deny-any: yes
    edns-buffer-size: 1232

    # DNS rebinding protection: public names must not resolve to private
    # addresses.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16

    # Unbound's own recommendation. A low threshold makes Unbound flush the
    # whole cache when unwanted replies pile up; afterwards every domain is
    # cold and depends on every hiccup of its name server.
    unwanted-reply-threshold: 10000000

    # 0x20 randomises the letter case of outgoing queries. Several CDNs do
    # not echo it back reliably, Unbound treats that as forgery and answers
    # SERVFAIL. Measured with four otherwise identical resolvers and a control
    # group: with 0x20 on, 10 % of lookups to one large CDN succeeded, with it
    # off 98-100 % - and an unrelated control domain failed too. "no" is
    # Unbound's default. Do not replace it with caps-exempt lists: the problem
    # is not limited to one CDN.
    use-caps-for-id: no

    ratelimit: 1000

    # --- Logging -------------------------------------------------------------

    # To stderr, so "docker logs unbound" shows it (Docker rotates the log).
    logfile: ""
    use-syslog: no
    verbosity: 0
    log-queries: no
    log-replies: no
    log-local-actions: no
    # Reasons for SERVFAIL answers. Without them a SERVFAIL storm leaves no
    # trace; the lines are logged at error level regardless of verbosity.
    log-servfail: yes

    # --- Performance (Raspberry Pi 5, 4 cores) -------------------------------

    num-threads: 3
    so-reuseport: yes
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    outgoing-range: 8192
    num-queries-per-thread: 4096
    incoming-num-tcp: 10
    delay-close: 10000
    rrset-roundrobin: yes
    # A name server that missed one answer otherwise counts as dead for up to
    # 15 minutes: fast SERVFAILs long after it is back. Keep probing it.
    infra-keep-probing: yes
    do-not-query-localhost: no


remote-control:
    control-enable: no
