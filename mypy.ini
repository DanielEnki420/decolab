# mypy: type checks for Decolab's Python (tools/check.sh lint, CI). Version
# pinned in tools/requirements-lint.txt.
[mypy]
python_version = 3.13
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
cache_dir = /dev/null

# OLED libraries come from Debian (python3-luma.oled, python3-pil), not pip
[mypy-luma.*,PIL.*]
ignore_missing_imports = True
