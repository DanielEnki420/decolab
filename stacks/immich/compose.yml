# Immich (photos). Module: MODULE_IMMICH=yes.
#
# Updated by hand only: new Immich versions migrate the database schema, and
# a failed migration needs the database backup at hand. Change both images
# (server and machine learning, tag AND digest) together, after reading the release
# notes, never through Watchtower.
#
# Env files (see compose/core.yml): decolab.conf, runtime.env and
# $SECRETS_DIR/immich.env (DB_PASSWORD, DB_USERNAME, DB_DATABASE_NAME), the
# last one also as env_file for the server.

name: decolab-immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    mem_limit: 2560m
    volumes:
      - ${DATA_DIR}/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ${SECRETS_DIR}/immich.env
    environment:
      HOME: /tmp
    # Measured with docker diff: nothing outside /data and /tmp changes.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    # The library must belong to this user (thumbs, encoded-video and the
    # .immich marker files included), or uploads fail.
    user: "${DECOLAB_UID}:${DECOLAB_GID}"
    ports:
      - "${WEB_UI_ADDRESS}:2283:2283"
    depends_on: [redis, database]
    restart: always
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    mem_limit: 3g
    user: "${DECOLAB_UID}:${DECOLAB_GID}"
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    volumes:
      - model-cache:/cache
    env_file:
      - ${SECRETS_DIR}/immich.env
    restart: always
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    mem_limit: 256m
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    mem_limit: 1g
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    # The data directory belongs to the image's postgres user (uid 999).
    # Never chown -R across ${DATA_DIR}/immich: it would hit the database.
    volumes:
      - ${DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: false

volumes:
  model-cache:
